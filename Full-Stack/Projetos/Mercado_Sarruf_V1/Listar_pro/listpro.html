<!doctype html> <!-- versão dop HTML -->
<html lang="pt-BR"> <!-- lingua que vai ser usada, e onde ficara todo o codigo htm(linguemgem de marcação)l-->

<head> <!-- cabeça da pagina -->
    <meta charset="UTF-8"> <!-- codificação dos caracteres -->
    <title> Listagem de produtos </title> <!-- titulo que vai ficar na janela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- meta dados -->
    <link rel="stylesheet" href="../comum.css"><!-- link esterno para o arquivo css -->
    <link rel="shortcut icon" type="imagex/png" href="../Imgs/Manecreft_icone1.ico">
</head>

<body> <!-- corpo da pagina -->
    <main> <!-- meio da pagina(maior parte do conteudo) -->
        <h1> Listagem de Produtos </h1>
        <section>
            <div class="alinha-esquerda">
                <form id="listagem_pro" method="post" action="listar_pro1.jsp">
                    <label for="listagem_pro"> Ver produtos: </label>
                    <input id="listagem_pro" type="submit" value=" Ir ">
                </form>
                <p> Tabela ordena alfabéticamente </p>
                <!-- dentro do form ele executara e passra a tabela de produto para o java e prosteriormente para o mysql -->
            </div><!-- abilita uma classe que alinha para a esquerda e cria uma linha de cor X -->
        </section>
        <hr>
        <section>
            <div class="alinha-esquerda">
                <form id="listagem_pro" method="post" action="listar_pro2.jsp">
                    <label for="id"> ID: </label>
                    <input id="id" type="text" name="id" placeholder="digite aqui" size="35" maxlength="50"><br>
                    <label for="codigo"> Codigo: </label>
                    <input id="codigo" type="text" name="codigo" placeholder="digite aqui" size="35" maxlength="50"><br>
                    <label for="nome"> Nome: </label>
                    <input id="nome" type="text" name="nome" placeholder="digite aqui" size="35" maxlength="50"><br>
                    <label for="preco"> Preço: </label>
                    <input id="preco" type="text" name="preco" placeholder="digite aqui" size="35"
                        pattern="[0-9]+([,\.][0-9]+)?" maxlength="50"><br>
                    <label for="quantidade"> Quantidade: </label>
                    <input id="quantidade" type="text" name="quantidade" placeholder="digite aqui" size="35"
                        maxlength="50"><br>
                    <input id="listagem_pro" type="submit" value=" Pesquisar ">
                </form>
                <p> Pesquisar produtos com as caracteristacas posta, ordenada alfabetica </p>
                <!-- dentro do form ele executara e passra a tabela de produto para o java e prosteriormente para o mysql -->
            </div><!-- abilita uma classe que alinha para a esquerda e cria uma linha de cor X -->
        </section>
    </main>
</body>

</html>
