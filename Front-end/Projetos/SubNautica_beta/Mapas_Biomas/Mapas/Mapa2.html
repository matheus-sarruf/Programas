<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link rel="shortcut icon" type="imagex/png"

    <style>
        /*onde ficara todo o codigo css(linguagem de estilização), observe que ate o comentario é diferente*/
        html,
        body {
            overflow-x: hidden;
        }

        * {
            margin: 0 auto;
        }

        @media (max-width: 700px) {
            main img {
                margin-right: 35px !important;
                width: 90% !important;
                height: auto !important;
            }

            main {

        body {

        h1 {

            font-size: 30px;
            color: #00fff2;
            text-shadow: 2px 2px 4px rgb(0, 0, 0);
            text-align: center;
            padding: 14px 0;
        }

        main {
            width: 100%;
            height: auto;
            padding: 50px 0px 50px 0px;
            display: flex;
            flex-direction: column;
        }

        main img {
            border-radius: 25px;
            border: 1px solid black;
            margin-top: 50px;
            width: 55%;
            height: 100%;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: grey;
        }

        .linkers a {
            color: rgb(0, 124, 232);
            text-shadow: 1px 1px 1px black;
            transition: font-size 20s ease-in-out;
        }

        .linkers a:hover {
            color: rgb(255, 0, 0);
        }

        .link_zoa a:hover {

            color: black;
        }

        .espacamento {
